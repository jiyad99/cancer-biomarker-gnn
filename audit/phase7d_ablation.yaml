methodology_notes:
- Every ablation shares the identical 15-fold CV splits used in Phase 7/7B/7C.
- GATv4Variant with all-default flags is verified bit-for-bit parameter-count-identical
  to Phase 7 GATv4 (7,585 params).
- Axis B (no_graph) uses an empty edge_index -- GATConv add_self_loops=True still
  adds self-loops, so message passing degenerates to a per-node linear transform,
  not literally zero computation.
- Axis B (random_graph) preserves edge COUNT and the exact edge-WEIGHT distribution
  of the real PPI graph, only rewiring which nodes connect -- isolates topology-specific
  signal from graph-density/weight-scale effects.
- All deltas are computed against this notebook's own re-trained full_gatv4, not directly
  against Phase 7's numbers, to control for any run-to-run noise; the two are cross-checked
  in Cell 8.
